name: biparsing-state
version: 0.0.0.1
synopsis: Positional types for stateful forward parsing.
homepage: https://github.com/BebeSparkelSparkel/biparsing
category: Parsing
author: William Rusnack
license: BSD-3-Clause
license-file: LICENSE

spec-version: 0.36.0

library:
  source-dirs: src/
  dependencies:
    - name: base
      mixin:
        - hiding (Prelude)
    - biparsing-core
    - data-default
    - microlens
    - microlens-th
    - mono-traversable
    - transformers
  default-extensions:
    - BlockArguments
    - ConstraintKinds
    - DataKinds
    - FlexibleContexts
    - FlexibleInstances
    - GeneralizedNewtypeDeriving
    - ImportQualifiedPost
    - KindSignatures
    - MultiParamTypeClasses
    - ScopedTypeVariables
    - StandaloneDeriving
    - TypeApplications
    - TypeFamilies
  ghc-options:
    - -Werror
    - -Weverything

    - -Wno-implicit-prelude
    - -Wno-missing-deriving-strategies
    - -Wno-missing-kind-signatures
    - -Wno-missing-local-signatures
    - -Wno-missing-safe-haskell-mode
    - -Wno-safe
    - -Wno-unsafe

    - -Wno-unused-packages

