name: biparsing-core
version: 0.0.0.1
synopsis: Core modules for biparsing.
homepage: https://github.com/BebeSparkelSparkel/biparsing
category: Parsing
author: William Rusnack
license: BSD-3-Clause
license-file: LICENSE

spec-version: 0.36.0

library:
  source-dirs: src/
  other-modules:
    - Prelude
  dependencies:
    - name: base
      mixin:
        - hiding (Prelude)
    - containers
    - data-default
    - data-diverse
    - extra
    - hvect
    - microlens
    - microlens-mtl
    - microlens-pro
    - microlens-th
    - mtl >= 2.3
    - profunctors
    - profunctor-monad
    - semigroupoids
    - transformers >= 0.6.1.1
    - mono-traversable

    # remove dependencies after Data.EqElement is removed
    - text >= 2.1.1
    - bytestring
    - split
    - stringsearch
  default-extensions:
    - AllowAmbiguousTypes
    - BlockArguments
    - ConstraintKinds
    - DataKinds
    - DeriveFunctor
    - DeriveGeneric
    - DerivingVia
    - DuplicateRecordFields
    - FlexibleContexts
    - FlexibleInstances
    - FunctionalDependencies
    - GeneralizedNewtypeDeriving
    - ImportQualifiedPost
    - LambdaCase
    - MultiParamTypeClasses
    - PatternSynonyms
    - QuantifiedConstraints
    - RankNTypes
    - RecordWildCards
    - ScopedTypeVariables
    - StandaloneDeriving
    - StandaloneKindSignatures
    - TupleSections
    - TypeApplications
    - TypeFamilies
    - TypeOperators
  ghc-options:
    - -Werror
    - -Weverything

    - -Wno-implicit-prelude
    - -Wno-missing-deriving-strategies
    - -Wno-missing-kind-signatures
    - -Wno-missing-local-signatures
    - -Wno-missing-safe-haskell-mode
    - -Wno-safe
    - -Wno-unsafe

    - -Wno-unused-packages
