name: biparsing-test
version: 0.0.0.1
synopsis: Test Prelude for the biparsing suite.
homepage: https://github.com/BebeSparkelSparkel/biparsing
category: Parsing
author: William Rusnack
license: BSD-3-Clause
license-file: LICENSE

spec-version: 0.36.0

library:
  exposed-modules: Prelude
  source-dirs: .
  dependencies:
    - name: base
      mixin:
        - hiding (Prelude)
    - QuickCheck
    - biparsing-combinators
    - biparsing-control
    - biparsing-core
    - biparsing-state
    - biparsing-text
    - bytestring
    - containers
    - data-default
    - hspec
    - hspec-core
    - microlens
    - mono-traversable
    - mtl
    - profunctors
    - quickcheck-instances
    - safe
    - semigroupoids
    - text >= 2.1.1
    - transformers
    - vector
    - temporary
