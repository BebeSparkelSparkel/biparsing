name: biparsing-text
version: 0.0.0.1
synopsis: Combinators for working with text data typically String, Text, or ByteString.
homepage: https://github.com/BebeSparkelSparkel/biparsing
category: Parsing
author: William Rusnack
license: BSD-3-Clause
license-file: LICENSE

spec-version: 0.36.0

library:
  source-dirs: src/
  other-modules:
    - Prelude
  dependencies:
    - name: base
      mixin:
        - hiding (Prelude)
    - biparsing-core
    - biparsing-state
    - biparsing-combinators
    - mtl
    - semigroupoids
    - safe
    - microlens
    - microlens-th
    - data-default
    - profunctors
    - mutable-containers
    - mono-traversable
    - extra
  default-extensions:
    - BlockArguments
    - ConstraintKinds
    - DataKinds
    - DeriveFunctor
    - FlexibleContexts
    - FlexibleInstances
    - ImportQualifiedPost
    - LambdaCase
    - MultiParamTypeClasses
    - PatternSynonyms
    - QuantifiedConstraints
    - RankNTypes
    - ScopedTypeVariables
    - StandaloneKindSignatures
    - TypeApplications
    - TypeFamilies
  ghc-options:
    - -Werror
    - -Weverything

    - -Wno-implicit-prelude
    - -Wno-missing-deriving-strategies
    - -Wno-missing-kind-signatures
    - -Wno-missing-local-signatures
    - -Wno-missing-safe-haskell-mode
    - -Wno-safe
    - -Wno-unsafe

    - -Wno-unused-packages
